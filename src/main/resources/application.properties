# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── Application name (shown in Actuator /info and logs) ──────────────────────
spring.application.name=cognara-backend

# ─── DataSource (PostgreSQL) ──────────────────────────────────────────────────
# Spring reads these values from environment variables at startup.
# The syntax ${ENV_VAR_NAME} means: "substitute the value of the named
# environment variable here". If the variable is not set, the application
# will fail to start with a clear error, which is better than silently
# connecting to the wrong database.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cognara}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# hibernate.ddl-auto controls what Hibernate does to the database schema on startup:
#   none     – do nothing (use for production with migration tools like Flyway)
#   validate – verify schema matches entities but don't change anything
#   update   – add missing columns/tables (safe for dev, risky for prod)
#   create   – drop and recreate schema every startup (dangerous, data loss)
#   create-drop – like create, but also drops on shutdown
# We use "validate" so the app won't start if the schema doesn't match.
# During this milestone there are no entities yet, so Hibernate simply validates
# the connection.
spring.jpa.hibernate.ddl-auto=validate

# Show SQL statements in logs during development (disable in production)
spring.jpa.show-sql=false

# Formats the SQL output for readability when show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly set the PostgreSQL dialect so Hibernate generates correct SQL.
# From Hibernate 6+ (Spring Boot 3.x), this is usually auto-detected, but
# setting it explicitly avoids surprises.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─── Actuator ─────────────────────────────────────────────────────────────────
# Expose the health and info endpoints over HTTP.
# By default, only /actuator/health is exposed. We expose both.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
